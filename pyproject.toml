[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "summarizer-bot"
version = "0.1.0"
description = "Telegram bot that summarizes recent messages with an LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.30,<4.0",
  "ddgs>=9.0",
  "openai>=1.40.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
]

[project.scripts]
summarizer-bot = "summarizer_bot.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
